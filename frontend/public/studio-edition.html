.application:has(.rv2-layout) .topbar{height:49px;padding:0 18px}

.rv2-player .rv-comparison .rv-compare-phone{max-height:100%;height:calc(100% - 15px);width:auto}
.rv2-player .rv-comparison .rv-stage-label{font-size:9px;line-height:1;white-space:nowrap}
.rv2-player .rv-comparison .rv-compare-col{height:100%;min-height:0}
.rv2-player .rv-source-box{max-width:100%;max-height:100%}
.rv2-player .rv-phone-captions{font-size:clamp(10px,1.3vw,15px)}
.rv2-player .rv-stage.rv-single-source .rv-source-box{width:min(95%,820px);height:auto}

.rv2-playing-meta{font-size:10px;color:#aabbd0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.rv2-controls .rv-transport button.primary{min-width:100px}
.rv2-timeline{display:flex;flex-direction:column;gap:8px;padding:11px 12px 10px;background:#121e2d}

function bindProcessing(){if(ui.screen==='processing')runTicker()}
function runTicker(){
 clearInterval(processTimer);
 processTimer=setInterval(async()=>{
  try{
   const current=ui.jobId;
   const previous=db.jobs.find(j=>j.id===current);
   const oldStatus=previous?.status,oldStage=previous?.stage;
   await window.KadrBridge.refresh(db,ui);
   const job=db.jobs.find(j=>j.id===current);
   if(ui.screen==='processing'&&job){
     if(oldStatus!==job.status||oldStage!==job.stage){
       render();
       if(oldStatus==='running'&&job.status==='completed')notify('Монтаж завершён. Shorts готовы к проверке.');
     }else{
       const percentage=$('percentage'),bar=$('jobBar'),message=$('stageMessage');
       if(percentage)percentage.innerHTML=Math.round((job.progress||0)*100)+'<span style="font-size:26px">%</span>';
       if(bar)bar.style.width=Math.round((job.progress||0)*100)+'%';
       if(message)message.textContent=job.message||'';
     }
   }
   // Other views aren't re-rendered every few seconds: doing so would stop
   // video playback and lose focus while editing captions.
  }catch(error){console.warn('Live status polling failed',error)}
 },3200);
}

ntent">${esc(JSON.stringify(item?.result??ui.apiEntries[0]?.result??library(),null,2))}</pre><div class="inline-controls"><button class="btn sm" data-action="copy-json">⧉ Скопировать JSON</button><button class="btn sm" data-action="download-json">↓ Скачать JSON</button></div></div><div class="panel" style="padding:20px"><div class="section-title"><h2>Журнал обращений</h2><span class="tiny-note">${ui.apiEntries.length} запросов</span></div><div class="api-log-list">${ui.apiEntries.slice(0,22).map((x,i)=>`<button class="api-log-item ${ui.selectedCall===i?'active':''}" data-action="api-call" data-id="${i}"><span class="http-method ${x.method.toLowerCase()}">${x.method}</span><span style="min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(x.path)}</span><span>${x.ms} мс</span><b style="color:${x.status>=400?'#ff9aaa':'#89ddc0'}">${x.status}</b></button>`).join('')}</div>${ui.apiEntries.length?'':'<p class="caption">Пока нет запросов. Перейдите в любой раздел или обновите данные.</p>'}</div></div></div>`}

function c32(data){let crc=~0;for(const b of data){crc^=b;for(let i=0;i<8;i++)crc=crc&1?(crc>>>1)^0xEDB88320:crc>>>1}return (~crc)>>>0}
function zipFiles(files){const te=new TextEncoder(),chunks=[],cent=[],offsets=[];let offset=0;function pushU16(a,n){a.push(n&255,(n>>>8)&255)}function pushU32(a,n){a.push(n&255,(n>>>8)&255,(n>>>16)&255,(n>>>24)&255)}for(const file of files){const fn=te.encode(file.name),data=file.data,crc=c32(data),head=[];pushU32(head,0x04034b50);pushU16(head,20);pushU16(head,0x800);pushU16(head,0);pushU16(head,0);pushU16(head,0);pushU32(head,crc);pushU32(head,data.length);pushU32(head,data.length);pushU16(head,fn.length);pushU16(head,0);const local=new Uint8Array(head.length+fn.length+data.length);local.set(head);local.set(fn,head.length);local.set(data,head.length+fn.length);chunks.push(local);const central=[];pushU32(central,0x02014b50);pushU16(central,20);pushU16(central,20);pushU16(central,0x800);pushU16(central,0);pushU16(central,0);pushU16(central,0);pushU32(central,crc);pushU32(central,data.length);pushU32(central,data.length);pushU16(central,fn.length);pushU16(central,0);pushU16(central,0);pushU16(central,0);pushU16(central,0);pushU32(central,0);pushU32(central,offset);const entry=new Uint8Array(central.length+fn.length);entry.set(central);entry.set(fn,central.length);cent.push(entry);offset+=local.length}const centerSize=cent.reduce((s,x)=>s+x.length,0),footer=[];pushU32(footer,0x06054b50);pushU16(footer,0);pushU16(footer,0);pushU16(footer,files.length);pushU16(footer,files.length);pushU32(footer,centerSize);pushU32(footer,offset);pushU16(footer,0);return new Blob([...chunks,...cent,new Uint8Array(footer)],{type:'application/zip'})}

async function waitForFinishingJob(path,onProgress){
 for(let i=0;i<180;i++){
  const state=await request('GET',path,null,{quiet:true});
  if(onProgress)onProgress(state);
  if(['completed','failed','cancelled'].includes(state.status))return state;
  await new Promise(resolve=>setTimeout(resolve,1200));
 }
 throw new Error('Экспорт выполняется слишком долго. Запомните адрес: '+path);
}

 const canvas=$('fcCanvas'),cap=$('fcCaption');if(cap&&canvas){let drag=false;cap.onpointerdown=e=>{if(e.button!==0)return;drag=true;cap.setPointerCapture(e.pointerId);e.preventDefault()};cap.onpointermove=e=>{if(!drag)return;const box=canvas.getBoundingClientRect();s.x=Math.max(6,Math.min(94,Math.round((e.clientX-box.left)/box.width*100)));s.y=Math.max(7,Math.min(92,Math.round((e.clientY-box.top)/box.height*100)));finishUpdateView();for(const k of ['fcX','fcY']){if($(k)){$(k).value=k==='fcX'?s.x:s.y;$(k+'Label').textContent=$(k).value+'%'}}};cap.onpointerup=()=>{drag=false;store()};cap.ondblclick=()=>{s.x=50;s.y=74;finishUpdateView();store()};cap.onkeydown=e=>{const step=e.shiftKey?5:1;if(e.key==='ArrowUp')s.y=Math.max(6,s.y-step);else if(e.key==='ArrowDown')s.y=Math.min(94,s.y+step);else if(e.key==='ArrowLeft')s.x=Math.max(5,s.x-step);else if(e.key==='ArrowRight')s.x=Math.min(95,s.x+step);else return;e.preventDefault();finishUpdateView();store()}}
 const video=$('fcVideo'),audio=$('fcAudio');if(audio){audio.src=ui.finishAudioURL||('/api/music/tracks/'+encodeURIComponent(audioName(f))+'/stream');audio.volume=a.volume}if(video){const back=$('fcBackdrop');const bar=$('fcSeek');video.ontimeupdate=()=>{if(back&&Number.isFinite(back.duration)&&Math.abs(back.currentTime-video.currentTime)>.22){try{back.currentTime=video.currentTime}catch{}}if(bar&&Number.isFinite(video.duration)&&video.duration>0){bar.value=video.currentTime/video.duration*100;const t=$('fcTime');if(t)t.textContent=reviewTime(video.currentTime);}};video.onloadedmetadata=()=>{$('fcDuration').textContent=reviewTime(video.duration)};video.onplay=()=>{$('fcPlay').textContent='Ⅱ';back?.play().catch(()=>{});if(a.enabled&&audio?.src){audio.volume=a.volume;audio.play().catch(()=>{})}};video.onpause=()=>{$('fcPlay').textContent='▶';audio.pause();back?.pause()};video.onended=()=>{audio.pause();back?.pause()};bar.oninput=()=>{if(Number.isFinite(video.duration))video.currentTime=video.duration*Number(bar.value)/100};}
 $('fcPlay').onclick=()=>{if(video.paused)video.play().catch(()=>notify('Видео не удалось воспроизвести',true));else video.pause()};$('fcMute').onclick=()=>{video.muted=!video.muted;$('fcMute').classList.toggle('active',!video.muted);notify(video.muted?'Исходник без звука':'Оригинальный звук включён')};
 $('fcGuideToggle').onclick=()=>{s.safe_guides=!s.safe_guides;finishUpdateView();store();$('fcGuideToggle').classList.toggle('active',s.safe_guides)};
 $('fcPreviewReset').onclick=()=>{video.pause();video.currentTime=0;finishUpdateView()};
 $('fcReset').onclick=()=>{modal({title:'Сбросить оформление?',text:'Вернуть исходные настройки оформления этой серии на сервере.',confirm:'Сбросить',danger:true,onConfirm:async()=>{const fresh=finishingDefaults();await request('PUT',`/api/episodes/${ui.episodeId}/finishing`,fresh);db.finishing[ui.episodeId]=fresh;store();render();notify('Оформление сброшено и сохранено')}})};
 $('fcSave').onclick=async()=>{try{const res=await request('PUT',`/api/episodes/${ui.episodeId}/finishing`,getFinishing());const j=currentJob();if(j&&j.status==='completed'){await request('PUT',`/api/jobs/${j.id}/parts/${ui.finishPart+1}/captions`,finishCueBody(ui.finishPart));}store();notify('Правки сохранены на локальном сервере');}catch(e){notify(e.message,true)}};
 $('fcCopyStyle').onclick=()=>{const style=structuredClone(s);const prev=getFinishing().part_overrides;for(let i=1;i<=(db.plans[currentJob()?.id]?.parts?.length||5);i++){prev[String(i)] ||= {};prev[String(i)].style=structuredClone(style)}store();notify('Стиль выбранной части применён ко всем частям, тексты не изменены.');render()};
 $('fcDownloadPresets').onclick=()=>downloadText(`KADR_episode_${e.number}_finishing.json`,JSON.stringify({episode_id:e.id,...f},null,2));
 $('fcPreviewRequest').onclick=async()=>{
  try{
   const job=currentJob(),part=ui.finishPart;
   if(!job||job.status!=='completed')throw new Error('Нужен завершённый монтаж');
   const task=await request('POST',"/api/jobs/"+job.id+"/previews",{
    part_index:part+1,from:0,duration:5,settings:f
   });
   notify('FFmpeg создаёт предпросмотр. Подождите несколько секунд.');

 $('fcHearAudio')?.addEventListener('click',async()=>{const a=$('fcAudio');try{if(!a||!a.src)throw new Error('Нет аудиотрека для прослушивания');if(a.paused){await a.play();notify('Воспроизводится выбранный трек')}else{a.pause();notify('Прослушивание остановлено')}}catch(e){notify(e.message,true)}});
 canvas.addEventListener('keydown',ev=>{if(ev.target===canvas&&ev.code==='Space'){ev.preventDefault();$('fcPlay').click()}});
}
function mockFinishRoute(method,path,body){
 let m;
 if((m=path.match(/^\/api\/episodes\/([^/]+)\/finishing$/))){const e=epBy(m[1]);if(!e)mockError('Серия не найдена',404);if(method==='GET')return {episode_id:e.id,...structuredClone(getFinishing(e.id))};if(method==='PUT'){if(!body?.subtitles||!body?.audio||!body?.video)mockError('Некорректный профиль',422);db.finishing ||= {};db.finishing[e.id]=structuredClone({...body,version:1});return {episode_id:e.id,...structuredClone(db.finishing[e.id])};}}
 if((m=path.match(/^\/api\/jobs\/([^/]+)\/parts\/(\d+)\/captions$/))){const job=jobBy(m[1]),i=Number(m[2]);if(!job)mockError('Монтаж не найден',404);if(!db.plans[job.id]?.parts[i-1])mockError('Часть не найдена',404);db.captionOverrides ||= {};const key=`${job.id}:${i}`;if(method==='GET')return db.captionOverrides[key]||{job_id:job.id,...{part_index:i,cues:structuredClone(db.plans[job.id].parts[i-1].subtitles||[])},revision:1};if(method==='PUT'){if(!Array.isArray(body?.cues)||body.cues.some(c=>!Number.isFinite(c.start)||!Number.isFinite(c.end)||c.end<=c.start||typeof c.text!=='string'))mockError('Неверные реплики',422);db.captionOverrides[key]={job_id:job.id,part_index:i,cues:structuredClone(body.cues),revision:(db.captionOverrides[key]?.revision||1)+1};return db.captionOverrides[key];}}
 if((m=path.match(/^\/api\/jobs\/([^/]+)\/previews$/))&&method==='POST'){if(!jobBy(m[1]))mockError('Монтаж не найден',404);db.previews ||= {};const id='demo-preview-'+Date.now().toString(36);db.previews[id]={preview_id:id,job_id:m[1],part_index:body.part_index,status:'completed',url:null,mode:'browser_preview_only',created_at:new Date().toISOString()};return {...db.previews[id]};}
 if((m=path.match(/^\/api\/jobs\/([^/]+)\/previews\/([^/]+)$/))&&method==='GET'){return db.previews?.[m[2]]||mockError('Предпросмотр не найден',404)}
 if((m=path.match(/^\/api\/jobs\/([^/]+)\/exports$/))&&method==='POST'){if(!jobBy(m[1]))mockError('Монтаж не найден',404);db.exports ||= {};const id='demo-export-'+Date.now().toString(36);db.exports[id]={export_id:id,source_job_id:m[1],status:'queued',progress:0,created_at:new Date().toISOString(),files:[],mode:'simulation_only'};return db.exports[id]}
 if((m=path.match(/^\/api\/exports\/([^/]+)$/))&&method==='GET'){const x=db.exports?.[m[1]];return x||mockError('Экспорт не найден',404)}
 if(path==='/api/music/import'&&method==='POST'){if(!body?.name||!(body?.size>=0))mockError('Не выбран аудиофайл',422);db.music.tracks ||= [];if(!db.music.tracks.includes(body.name))db.music.tracks.push(body.name);return {track_id:'demo-'+Date.now().toString(36),name:body.name,size:body.size,content_type:body.content_type||'audio/mpeg',playback_url:null,stored:false,mode:'browser_only'};}
 if((m=path.match(/^\/api\/music\/tracks\/([^/]+)\/stream$/))&&method==='GET'){return {demo:true,content_type:'audio/mpeg',stream_url:null,detail:'Поток от реального сервера пока отсутствует; загрузите локальное аудио для прослушивания.'}}
 return undefined;
}
