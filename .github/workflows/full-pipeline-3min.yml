name: KADR 3-minute full pipeline E2E

on:
  workflow_dispatch:
  push:
    branches: ['codex/dramatic-montage']
    paths:
      - scripts/full_pipeline_3min.py
      - scripts/prepare_real_test_video.py
      - app/run_logging.py
      - app/media.py
      - app/pipeline.py
      - app/studio_render.py
      - app/server.py
      - .github/workflows/full-pipeline-3min.yml
  schedule:
    - cron: '15 4 * * 6'

permissions:
  contents: read

jobs:
  three-minute-offline:
    name: Real 180s video -> plan -> FFmpeg -> cache -> recovery -> finishing
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install offline pipeline dependencies
        run: python -m pip install -q fastapi uvicorn python-multipart pillow numpy opencv-python-headless pytest pytest-timeout httpx
      - name: Link real ffmpeg and ffprobe into project tools
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          fi
          command -v ffmpeg
          command -v ffprobe
          mkdir -p tools/ffmpeg/bin temp cache data/jobs data/imports
          ln -sf "$(command -v ffmpeg)" tools/ffmpeg/bin/ffmpeg.exe
          ln -sf "$(command -v ffprobe)" tools/ffmpeg/bin/ffprobe.exe
      - name: Generate actual 180s MP4, run production video pipeline 3 times, verify FFmpeg finishing
        timeout-minutes: 23
        run: |
          python scripts/full_pipeline_3min.py --mode offline --directory temp/ci-full-pipeline-3min
      - name: Prove real FFmpeg can excerpt 180 seconds from a longer video
        if: success()
        timeout-minutes: 5
        run: |
          python - <<'PY'
          import hashlib
          import subprocess
          from pathlib import Path
          from app import config
          from app.media_probe import probe_media
          from scripts.prepare_real_test_video import prepare
          config.setup_environment()
          root = Path('temp/ci-full-pipeline-3min').resolve()
          original = root / 'source-180s.mp4'
          longer = root / 'source-190s.mp4'
          subprocess.run([
              str(config.FFMPEG), '-hide_banner', '-loglevel', 'error',
              '-stream_loop', '1', '-i', str(original), '-t', '190',
              '-map', '0:v:0', '-map', '0:a:0', '-c', 'copy',
              '-y', str(longer)
          ], check=True, timeout=60)
          assert probe_media(longer)['duration'] > 189
          old_hash = hashlib.sha256(longer.read_bytes()).hexdigest()
          sample = prepare(longer, root / 'selected-180s', start_seconds=5.0)
          assert sample.is_file()
          assert 179.8 <= probe_media(sample)['duration'] <= 180.2
          assert hashlib.sha256(longer.read_bytes()).hexdigest() == old_hash
          print('Real 190s to 180s excerpt PASS; original unchanged')
          PY
      - name: Assert machine-readable report is complete
        if: success()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('temp/ci-full-pipeline-3min/report.json').read_text('utf-8'))
          assert report['duration_seconds'] == 180
          assert report['status'] == 'passed'
          assert report['analysis_mode'] == 'deterministic_semantic_fixture_NOT_ASR_OR_VLM'
          from pathlib import Path
          log_dir=Path(report['logs_dir'])
          assert log_dir.is_dir()
          events=list(log_dir.glob('events-*.jsonl'))
          assert events and any('check_passed' in p.read_text('utf-8') for p in events)
          latest=Path('logs')/'LATEST.txt'
          assert latest.exists()
          actual=Path(latest.read_text('utf-8').strip())
          assert actual.is_dir(), latest.read_text('utf-8')
          assert report['cache']['all_parts_reused']
          assert report['cache']['corrupt_srt_forced_rerender']
          assert report['finished_preview']['sha256']
          assert any(row['name'] == 'real_studio_http_source_plan_mp4_srt_and_range'
                     and row['status'] == 'passed' for row in report['checks'])
          assert len(report['pipeline_stages']) > 0
          assert all(row['status'] == 'passed' for row in report['checks'])
          print('3-minute FFmpeg pipeline and recovery acceptance PASS')
          PY
      - name: Upload logs and reports even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-pipeline-3min-report
          if-no-files-found: warn
          retention-days: 14
          path: |
            temp/ci-full-pipeline-3min/report.json
            logs/tests/**/events-*.jsonl
            logs/tests/**/readable-*.log
            logs/tests/**/session.json
            temp/ci-full-pipeline-3min/source-180s.mp4
            temp/ci-full-pipeline-3min/data/jobs/*/output/*.mp4
            temp/ci-full-pipeline-3min/data/jobs/*/output/*.srt
            temp/ci-full-pipeline-3min/data/jobs/*/finished/*.mp4
            temp/ci-full-pipeline-3min/data/jobs/*/e2e-progress.jsonl
            temp/ci-full-pipeline-3min/data/jobs/*/timings.json
            temp/ci-full-pipeline-3min/data/jobs/*/final_quality_gate.json
            temp/ci-full-pipeline-3min/data/jobs/*/diagnostics/summary.json
            temp/ci-full-pipeline-3min/data/jobs/*/plan.json
