name: KADR production checks

on:
  push:
    branches: [main, 'codex/**', 'fix/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    name: React tests, lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: React regression tests
        working-directory: frontend
        run: npm test
      - name: Verify exact Studio Edition HTML, JavaScript and CSS
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          original = Path("frontend/public/studio-edition-reference.html").read_text("utf-8")
          live = Path("frontend/public/studio-edition.html").read_text("utf-8")
          original_css = original.split("<style>", 1)[1].split("</style>", 1)[0]
          external_css = Path("frontend/public/studio-edition.css").read_text("utf-8")
          external_js = Path("frontend/public/studio-edition-app.js").read_text("utf-8")
          assert original_css == external_css, "Studio Edition visual styles drifted"
          assert '<link rel="stylesheet" href="/studio-edition.css">' in live
          assert '<script src="/studio-live-bridge.js"></script>' in live
          assert '<script src="/studio-edition-app.js"></script>' in live
          assert '<style>' not in live and '<script>' not in live
          assert 'window.KadrBridge.refresh' in external_js
          assembled = live + external_css + external_js
          for required in ("fc-workspace", "rv2-layout", "navset", "sidebar", "topbar"):
              assert required in assembled, required
          print("Reference CSS is byte-for-byte equal; UI uses external CSP-compliant scripts")

          PY
          node --check frontend/public/studio-live-bridge.js
          node --check frontend/public/studio-edition-app.js
      - name: Execute exact Studio Edition screens with simulated FastAPI
        run: node frontend/scripts/smoke-studio-exact.mjs
      - name: Exercise Studio API refresh, error isolation and retry cache
        run: node frontend/scripts/smoke-studio-bridge.mjs
      - name: TypeScript and Vite build
        working-directory: frontend
        run: npm run build
      - name: Verify exact HTML and bridge included in production dist
        run: |
          test -s frontend/dist/studio-edition.html
          test -s frontend/dist/studio-live-bridge.js
          test -s frontend/dist/studio-edition-reference.html
          test -s frontend/dist/studio-edition.css
          test -s frontend/dist/studio-edition-app.js
      - name: ESLint
        working-directory: frontend
        run: npm run lint

  engine:
    name: Montage engine offline regressions
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install engine test dependencies
        run: python -m pip install -q fastapi uvicorn python-multipart pillow numpy opencv-python-headless pytest pytest-timeout httpx
      - name: Provide system FFmpeg as an isolated test binary
        run: |
          if ! command -v ffmpeg >/dev/null; then sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg; fi
          mkdir -p tools/ffmpeg/bin
          ln -sf "$(command -v ffmpeg)" tools/ffmpeg/bin/ffmpeg.exe
          ln -sf "$(command -v ffprobe)" tools/ffmpeg/bin/ffprobe.exe
      - name: Prepare engine-only writable directories
        run: mkdir -p temp cache data/jobs data/imports
      - name: Test scene comprehension, media, caches, model API, job lifecycle and music
        run: |
          python -m pytest -vv -x --timeout=180 --timeout-method=thread \
            tests/test_analysis.py \
            tests/test_semantic_pipeline.py \
            tests/test_bounded_storyboard.py \
            tests/test_bounded_frame_contract.py \
            tests/test_media.py \
            tests/test_music.py \
            tests/test_deepseek.py \
            tests/test_jobs.py \
            tests/test_job_progress.py \
            tests/test_recovery_tokens.py \
            tests/test_scene_detection.py \
            tests/test_scene_refinement.py \
            tests/test_story_structure.py \
            tests/test_story_structure_pass.py \
            tests/test_dramatic_planner.py \
            tests/test_framing.py \
            tests/test_quality.py \
            tests/test_final_quality.py \
            tests/test_selection_gate.py \
            tests/test_source_continuity.py \
            tests/test_global_verification.py \
            tests/test_continuity_verification.py \
            tests/test_subtitles.py \
            tests/test_montage_regressions.py \
            tests/test_narrative_bridge.py \
            tests/test_speech_context.py \
            tests/test_question_context.py \
            tests/test_retention_allocation.py \
            tests/test_semantic_boundary.py \
            tests/test_boundary_triage_performance.py \
            tests/test_semantic_identity.py \
            tests/test_full_pipeline_harness.py \
            tests/test_run_logging.py \
            tests/test_verification_report_contract.py \
            tests/test_stage_timings.py \
            tests/test_prepare_real_test_video.py

  backend:
    name: Finishing API safety tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install lightweight API dependencies
        run: python -m pip install fastapi uvicorn python-multipart pillow pytest httpx
      - name: Check Python compilation
        run: python -m compileall -q app scripts tests
      - name: Test Studio Edition API and isolated exports
        run: python -m pytest -q tests/test_finishing.py tests/test_server_routing.py tests/test_recovery_tokens.py tests/test_scene_detection.py tests/test_production_entrypoints.py tests/test_launcher.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare actual Studio assets for backend integration smoke
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Smoke-check actual production API and UI without demo projects
        run: |
          python - <<'PY'
          from fastapi.testclient import TestClient
          from app.server import create_app

          with TestClient(create_app(), base_url="http://127.0.0.1:8765") as client:
              for route in ("/api/health", "/api/library", "/studio-edition.html"):
                  response = client.get(route)
                  assert response.status_code == 200, (route, response.status_code, response.text[:250])
              html = client.get("/studio-edition.html").text
              assert "studio-live-bridge.js" in html
          print("Production API and studio route OK; no demo data generated")
          PY
      - name: Install Chromium for real browser CSP verification
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Real browser smoke - reference styling, JS and navigation
        run: python tests/browser_studio_smoke.py

  windows-verification:
    name: Windows BAT / PowerShell report smoke
    runs-on: windows-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Parse actual Windows verification scripts
        shell: pwsh
        run: |
          foreach ($path in @('scripts/verify_project.ps1', 'scripts/test_full_pipeline_3min.ps1', 'scripts/publish_latest_ai_diagnostics.ps1')) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Join-Path (Get-Location).Path $path), [ref]$tokens, [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) { throw "PowerShell syntax errors in $path : $errors" }
          }
      - name: Smoke real Windows BAT report directory and offline execution guard
        shell: pwsh
        run: |
          # Exercise the same BAT as user, but quick mode to avoid paid AI
          # or 180s rendering in this *smoke*. Full video is run in separate CI.
          $env:KADR_NONINTERACTIVE = '1'
          # Windows runner may intentionally have missing local dependencies.
          # Its smoke checks report generation, not whether Quick itself passes.
          # The BAT may exit 1 because this clean runner deliberately lacks
          # the app's portable dependencies. Capture that expected result
          # without GitHub's PowerShell native-command error promotion.
          $batch = Join-Path (Get-Location).Path 'ТЕСТЫ\1_ПРОВЕРКА_БЕЗ_ИИ.bat'
          $process = Start-Process -FilePath $env:ComSpec -ArgumentList @(
            '/d', '/c', ('"' + $batch + '" -Quick -NoUpload')
          ) -WorkingDirectory (Get-Location).Path -NoNewWindow -Wait -PassThru
          $code = $process.ExitCode
          $fullBatch = Join-Path (Get-Location).Path 'ТЕСТЫ\2_ПОЛНАЯ_ПРОВЕРКА_С_ИИ.bat'
          if (-not (Test-Path $fullBatch)) { throw 'Real-model test BAT missing' }
          if (-not ((Get-Content -Raw -Encoding UTF8 $fullBatch).Contains('-RequireRealModel'))) {
            throw 'Full BAT may silently run without real ASR/VLM'
          }
          if ($code -notin @(0, 1, 2)) { throw "Windows verification launcher failed: $code" }
          $latest = Get-ChildItem temp/verification-reports -Directory |
            Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $latest) { throw 'Verification run directory not created' }
          $checks = Join-Path $latest.FullName 'checks.json'
          $md = Join-Path $latest.FullName 'summary.md'
          if (-not (Test-Path $checks) -or -not (Test-Path $md)) {
            throw 'Windows BAT ended without checks.json / summary.md'
          }
          $report = Get-Content $checks -Raw | ConvertFrom-Json
          if ($report.mode -ne 'quick') { throw 'Wrong quick-mode metadata' }
          if ($report.run_id -ne $latest.Name) { throw 'Report stored under wrong run' }
          if (-not (Test-Path $report.logs_dir)) { throw 'Execution logs missing' }
      - name: Headless full-model BAT must report FAIL instead of running synthetic-only
        shell: pwsh
        run: |
          $env:KADR_NONINTERACTIVE = '1'
          $batch = Join-Path (Get-Location).Path 'ТЕСТЫ\2_ПОЛНАЯ_ПРОВЕРКА_С_ИИ.bat'
          # -Quick keeps the CI probe inexpensive. The full wrapper must
          # still enforce the missing real-source failure.
          $process = Start-Process -FilePath $env:ComSpec -ArgumentList @(
            '/d', '/c', ('"' + $batch + '" -Quick -NoUpload')
          ) -WorkingDirectory (Get-Location).Path -NoNewWindow -Wait -PassThru
          if ($process.ExitCode -eq 0) { throw 'Full AI BAT returned success with no real source' }
          $folders = Get-ChildItem temp/verification-reports -Directory |
            Sort-Object LastWriteTime -Descending
          $latest = $folders | Select-Object -First 1
          if (-not $latest) { throw 'Full-model report folder missing' }
          $report = Get-Content (Join-Path $latest.FullName 'checks.json') -Raw | ConvertFrom-Json
          $model = @($report.checks | Where-Object { $_.name -eq 'real_model_3min' })
          if ($model.Count -ne 1 -or $model[0].status -ne 'FAIL') {
            throw 'Full AI mode must never use the synthetic-only success path'
          }
          if ($report.run_profile -ne 'full_with_local_ai') { throw 'Wrong report mode' }
